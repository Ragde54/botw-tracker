services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botw
      POSTGRES_PASSWORD: botw
      POSTGRES_DB: botw
    ports:
      - "5432:5432"          # para conectarte con DBeaver/psql desde tu Mac
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botw -d botw"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://botw:botw@db:5432/botw
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Modo desarrollo: tu código local montado + recarga automática al guardar
    volumes:
      - ./src:/app/src
    command: ["uvicorn", "botw_tracker.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]

volumes:
  pgdata:
